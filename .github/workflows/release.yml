name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发仅用于验证双平台测试;Release 建档只在 tag push 时执行
  workflow_dispatch:

jobs:
  # 跨平台测试:git 探测(lib/git.ts)已兼容 Windows/POSIX,双平台都要绿
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm test = build(tsc + client bundle) + node --test
      - run: npm test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 打 tag 的版本必须和 package.json 一致,防止漏改版本号就发版
      - name: Verify tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag 与 package.json version $version 不一致,先 bump 版本号再打 tag"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      # 产出 dsh-coding-workspace-<version>.tgz
      - run: npm pack

      - name: Create GitHub Release and upload tgz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tgz=$(ls *.tgz)
          gh release create "$GITHUB_REF_NAME" "$tgz" --title "$GITHUB_REF_NAME" --generate-notes
